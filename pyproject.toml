[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapeer"
version = "1.0.12"
description = "Essential Python library that scrapes HTTP(S) and UDP trackers for torrent information."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "tboy1337"}
]
keywords = [
    "torrent",
    "torrents",
    "scraper",
    "scrapeer",
    "torrent-scraper",
    "torrent-scraping",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tboy1337/scrapeer-py"
Download = "https://github.com/tboy1337/scrapeer-py/releases/latest"
Repository = "https://github.com/tboy1337/scrapeer-py"
Author = "https://tboy1337.github.io/"

[project.scripts]
scrapeer = "scrapeer_cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-mock",
    "pytest-cov",
    "pylint",
    "mypy",
    "autopep8",
    "black",
    "isort",
    "bandit",
    "pip-audit",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scrapeer*"]

[tool.setuptools]
py-modules = ["scrapeer_cli"]

[tool.setuptools.package-data]
scrapeer = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
  | htmlcov
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [
    "*/venv/*",
    "*/.venv/*",
    "*/virtualenv/*",
    "*/build/*",
    "*/dist/*",
    "*/__pycache__/*",
    "*/htmlcov/*",
]
known_first_party = ["scrapeer"]
known_third_party = [
    "pytest",
    "hypothesis",
]
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]

[tool.bandit]
# B310: urllib.request.urlopen is required for HTTP tracker scraping
# B311: random peer IDs and UDP transaction IDs are not cryptographic
skips = ["B310", "B311"]
