[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=scrapeer --cov-report=term-missing --cov-report=html --cov-fail-under=100 --strict-markers --strict-config
timeout = 30
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
